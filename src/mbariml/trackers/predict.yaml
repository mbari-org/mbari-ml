# mbariml's tracker for `infer video --preset predict` (track mode: detection conf 0.0001,
# --min-track-length 60). Selected by `--tracker auto`, the default. See mbariml.steps.infer_video.
#
# Goal: the most accurate tracks (HOTA): fewer, cleaner tracks than curate,
# brief sightings dropped.
#
# Tuned on the DeepSea MOT benchmark (BD, BS, MWD, MWS; mean HOTA) with
# MBARI_VARS_452k_YOLO26s at imgsz 1952, NMS iou 0.2, 2,500 trials.
#
#                                            animals found   tracks   core HOTA
#   this config                                   198          235       61.7
#   this config, imgsz 992                        198          243       59.6
#   0.31.0 (conf 0.08, imgsz 992)                 169          216       48.6
#
# A tracker is only as good as the detections it may use: requiring 0.08 to
# extend a track broke most deep-sea tracks into pieces that never reached a
# confident frame. Here every detection can extend a track, a track starts at
# 0.003, and the 60-frame minimum removes the short junk instead.

tracker_type: bytetrack
track_high_thresh: 0.003  # first association; tracks also start here
track_low_thresh: 0.0001  # second association: every detection the detector returns
new_track_thresh: 0.003   # = high: start a track from any unmatched first-association detection
track_buffer: 30          # short: fragments of a lost track are dropped by the 60-frame minimum
match_thresh: 0.95        # cost gate on 1 - IoU: accept matches down to IoU 0.05
fuse_score: False
