[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbariml"
version = "0.28.0"
license = "MIT"
license-files = ["LICENSE"]
description = "YOLO detection -> embedding -> clustering -> curation pipeline for deep sea imagery."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.25",
    "duckdb>=1.5",
    "ultralytics>=8.4",
    "torch>=2.10",
    "torchvision>=0.25",
    "timm>=1.0.28",  # DINOv3 model support
    "pillow>=10.0",
    "opencv-python>=4.13",
    "numpy>=2.0",
    "pandas>=2.0",
    "tqdm>=4.67",
    "evoc>=0.3",
    "PySide6>=6.11",
    "pyqtgraph>=0.13",  # wheel-zoom/pan + draggable-box widgets for `mbariml review`
    "huggingface_hub>=0.34",  # `mbariml sam3 download`, and review finding sam3.pt in its cache
]

[project.optional-dependencies]
# Optional SAM3 in the review GUI: Ultralytics' CLIP, which isn't on PyPI (PyPI's
# `clip` is an unrelated clipboard tool). The model itself: `mbariml sam3 download`.
sam3 = ["clip @ git+https://github.com/ultralytics/CLIP.git"]

[project.scripts]
mbariml = "mbariml.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mbariml.gui" = ["*.svg"]  # the review GUI's checkbox checkmark
